name: USBiPhoneScreenCapture
options:
  bundleIdPrefix: info.fromkk.poc
  createIntermediateGroups: true
targets:
  USBiPhoneScreenCapture:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        NSCameraUsageDescription: "接続されたiPhoneのカメラ映像をContinuity Camera経由で表示するために使用します"
        NSCameraUseContinuityCameraDeviceType: true
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.fromkk.poc.USBiPhoneScreenCapture
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
